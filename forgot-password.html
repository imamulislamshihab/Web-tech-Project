<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset password | Caffinity</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body data-root="">
    <header class="site-header">
        <div class="container header-inner">
            <a class="brand" href="index.html"><span class="brand-cup" aria-hidden="true">☕</span>Caffinity</a>
            <button class="nav-toggle" type="button" aria-label="Open menu" aria-expanded="false">☰</button>
            <nav class="site-nav" aria-label="Main">
            <a href="index.html">Home</a>
            <a href="menu.html">Menu</a>
            <a href="reservation.html">Reserve a table</a>
            <a href="track-order.html">Track order</a>
                <a href="cart.html" class="cart-link">Cart <span class="cart-count" id="cart-count" hidden>0</span></a>
                <div class="account-links" id="account-links"></div>
            </nav>
        </div>
    </header>

    <main class="auth-wrap">
        <section class="card auth-card">
            <h1>Reset your password</h1>

            <form id="email-form" novalidate>
                <p class="muted">Enter the email you registered with.</p>
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email">
                    <p class="error"></p>
                </div>
                <button type="submit" class="btn btn-block">Continue</button>
            </form>

            <form id="reset-form" class="hidden" novalidate>
                <p class="muted small">In the final version, a reset link will be emailed to you. In this prototype you can set the new password here.</p>
                <div class="form-group">
                    <label for="new-password">New password</label>
                    <input type="password" id="new-password" autocomplete="new-password">
                    <p class="error"></p>
                </div>
                <div class="form-group">
                    <label for="confirm">Confirm new password</label>
                    <input type="password" id="confirm" autocomplete="new-password">
                    <p class="error"></p>
                </div>
                <button type="submit" class="btn btn-block">Save new password</button>
            </form>

            <p class="small center" style="margin-top:16px"><a href="login.html">Back to log in</a></p>
        </section>
    </main>

   
</body>
</html>
