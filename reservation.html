<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reserve a table | Caffinity</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body data-root="">
    <header class="site-header">
        <div class="container header-inner">
            <a class="brand" href="index.html"><span class="brand-cup" aria-hidden="true">☕</span>Caffinity</a>
            <button class="nav-toggle" type="button" aria-label="Open menu" aria-expanded="false">☰</button>
            <nav class="site-nav" aria-label="Main">
            <a href="index.html">Home</a>
            <a href="menu.html">Menu</a>
            <a href="reservation.html" class="active" aria-current="page">Reserve a table</a>
            <a href="track-order.html">Track order</a>
                <a href="cart.html" class="cart-link">Cart <span class="cart-count" id="cart-count" hidden>0</span></a>
                <div class="account-links" id="account-links"></div>
            </nav>
        </div>
    </header>

    <main class="page">
        <div class="container two-col">
            <section class="card">
                <h1>Reserve a table</h1>
                <p class="muted">Send a request and the cafe will approve or decline it. You can see the status below.</p>

                <form id="reserve-form" novalidate>
                    <div class="form-grid">
                        <div class="form-group">
                            <label for="date">Date</label>
                            <input type="date" id="date">
                            <p class="error"></p>
                        </div>
                        <div class="form-group">
                            <label for="time">Time</label>
                            <input type="time" id="time">
                            <p class="error"></p>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="guests">Number of guests</label>
                        <input type="number" id="guests" min="1" max="12" value="2">
                        <p class="error"></p>
                    </div>
                    <div class="form-group">
                        <label for="note">Special request (optional)</label>
                        <textarea id="note" placeholder="Birthday, window seat, high chair..."></textarea>
                    </div>
                    <button type="submit" class="btn">Request reservation</button>
                </form>
            </section>

            <aside class="card">
                <h2 class="card-title">Your reservations</h2>
                <div id="my-reservations"></div>
            </aside>
        </div>
    </main>

    <footer class="site-footer">
        <div class="container row-between">
            <span>© 2026 Caffinity. Coffee, comfort food and more.</span>
            <span><a href="menu.html">Menu</a> &nbsp; <a href="reservation.html">Reservations</a> &nbsp; <a href="login.html">Staff login</a></span>
        </div>
    </footer>
   
</body>
</html>
