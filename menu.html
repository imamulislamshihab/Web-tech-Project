<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu | Caffinity</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body data-root="">
    <header class="site-header">
        <div class="container header-inner">
            <a class="brand" href="index.html"><span class="brand-cup" aria-hidden="true">☕</span>Caffinity</a>
            <button class="nav-toggle" type="button" aria-label="Open menu" aria-expanded="false">☰</button>
            <nav class="site-nav" aria-label="Main">
            <a href="index.html">Home</a>
            <a href="menu.html" class="active" aria-current="page">Menu</a>
            <a href="reservation.html">Reserve a table</a>
            <a href="track-order.html">Track order</a>
                <a href="cart.html" class="cart-link">Cart <span class="cart-count" id="cart-count" hidden>0</span></a>
                <div class="account-links" id="account-links"></div>
            </nav>
        </div>
    </header>

    <main class="page">
        <div class="container">
            <div class="page-head">
                <h1>Our menu</h1>
                <p>Freshly made coffee, snacks, meals and desserts.</p>
            </div>

            <div class="table-banner hidden" id="table-banner"></div>
            <div class="table-banner hidden" id="closed-banner" style="background:var(--red-soft);border-color:#E9C2BE"></div>

            <div class="menu-tools">
                <input type="text" id="search" aria-label="Search menu" placeholder="Search coffee, burgers, cake...">
                <div class="chips" id="chips"></div>
            </div>

            <div class="menu-grid" id="menu-grid"></div>
            <p class="empty hidden" id="no-results">No items match your search. Try another word or category.</p>
        </div>
    </main>

    <footer class="site-footer">
        <div class="container row-between">
            <span>© 2026 Caffinity. Coffee, comfort food and more.</span>
            <span><a href="menu.html">Menu</a> &nbsp; <a href="reservation.html">Reservations</a> &nbsp; <a href="login.html">Staff login</a></span>
        </div>
    </footer>
  
</body>
</html>
