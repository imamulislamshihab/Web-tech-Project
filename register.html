<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create account | Caffinity</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body data-root="">
    <header class="site-header">
        <div class="container header-inner">
            <a class="brand" href="index.html"><span class="brand-cup" aria-hidden="true">☕</span>Caffinity</a>
            <button class="nav-toggle" type="button" aria-label="Open menu" aria-expanded="false">☰</button>
            <nav class="site-nav" aria-label="Main">
            <a href="index.html">Home</a>
            <a href="menu.html">Menu</a>
            <a href="reservation.html">Reserve a table</a>
            <a href="track-order.html">Track order</a>
                <a href="cart.html" class="cart-link">Cart <span class="cart-count" id="cart-count" hidden>0</span></a>
                <div class="account-links" id="account-links"></div>
            </nav>
        </div>
    </header>

    <main class="auth-wrap">
        <section class="card auth-card">
            <h1>Create your account</h1>
            <p class="muted">Customer accounts only. Staff accounts are created by the cafe owner.</p>

            <form id="register-form" novalidate>
                <div class="form-group">
                    <label for="name">Full name</label>
                    <input type="text" id="name" autocomplete="name">
                    <p class="error"></p>
                </div>
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" autocomplete="email">
                    <p class="error"></p>
                </div>
                <div class="form-group">
                    <label for="phone">Phone number</label>
                    <input type="tel" id="phone" placeholder="01XXXXXXXXX" autocomplete="tel">
                    <p class="error"></p>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" autocomplete="new-password">
                    <p class="error"></p>
                </div>
                <div class="form-group">
                    <label for="confirm">Confirm password</label>
                    <input type="password" id="confirm" autocomplete="new-password">
                    <p class="error"></p>
                </div>
                <button type="submit" class="btn btn-block">Create account</button>
            </form>

            <p class="small center" style="margin-top:16px">Already have an account? <a href="login.html">Log in</a></p>
        </section>
    </main>

   
</body>
</html>
